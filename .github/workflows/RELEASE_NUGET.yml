name: Release Package

# This action will start when a correctly formatted tag is pushed (e.g. 0.1.0)

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*-*'
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest
    permissions:
      # id-token for NuGet Trusted Publishing (OIDC), so there is no API key secret to expire.
      id-token: write
      contents: read

    steps:

    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup dotnet
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: |
          10.x
 
    - name: Build
      run: dotnet build .\UmBootstrap.DotNet.Template.csproj -c Release /p:Version=${{github.ref_name}}

    - name: Pack
      run: dotnet pack .\UmBootstrap.DotNet.Template.csproj -c Release /p:Version=${{github.ref_name}} --no-build --output .

    - name: NuGet Trusted Publishing Login
      id: nuget-login
      uses: nuget/login@v1
      with:
        user: dean.leigh

    - name: Push to NuGet
      run: dotnet nuget push **\*.nupkg -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json
